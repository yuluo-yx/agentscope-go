name: OpenSandbox

permissions:
  contents: read

on:
  push:
    paths:
      - 'pkg/workspace/opensandbox/**'
      - 'pkg/workspace/internal/sandboxed/**'
      - 'pkg/workspace/gateway/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/opensandbox.yml'
  pull_request:
    paths:
      - 'pkg/workspace/opensandbox/**'
      - 'pkg/workspace/internal/sandboxed/**'
      - 'pkg/workspace/gateway/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/opensandbox.yml'
  workflow_dispatch:

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'yuluo-yx/agentscope-go'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -race -covermode=atomic -coverprofile="$RUNNER_TEMP/opensandbox-unit.out" ./pkg/workspace/opensandbox

      - name: Enforce coverage
        shell: bash
        run: |
          coverage="$(go tool cover -func="$RUNNER_TEMP/opensandbox-unit.out" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          if [[ -z "$coverage" ]]; then
            echo "OpenSandbox coverage total is missing" >&2
            exit 1
          fi
          if ! awk -v coverage="$coverage" 'BEGIN { exit !(coverage + 0 >= 90) }'; then
            echo "OpenSandbox coverage ${coverage}% is below 90%" >&2
            exit 1
          fi
          echo "OpenSandbox coverage: ${coverage}%"

      - name: Run go vet
        run: go vet ./pkg/workspace/opensandbox

  e2e:
    name: End-to-End Tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.repository == 'yuluo-yx/agentscope-go' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    environment: opensandbox-e2e
    concurrency:
      group: opensandbox-e2e
      cancel-in-progress: false
    env:
      OPEN_SANDBOX_DOMAIN: ${{ secrets.OPEN_SANDBOX_DOMAIN }}
      OPEN_SANDBOX_API_KEY: ${{ secrets.OPEN_SANDBOX_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'

      - name: Download dependencies
        run: go mod download

      - name: Prepare OpenSandbox endpoint
        shell: bash
        run: |
          if [[ -n "$OPEN_SANDBOX_DOMAIN" ]]; then
            echo "Using the configured OpenSandbox endpoint"
            exit 0
          fi

          python3 -m venv "$RUNNER_TEMP/opensandbox-server-venv"
          "$RUNNER_TEMP/opensandbox-server-venv/bin/pip" install \
            'opensandbox-server==0.2.1'
          "$RUNNER_TEMP/opensandbox-server-venv/bin/opensandbox-server" \
            init-config "$RUNNER_TEMP/opensandbox.toml" --example docker
          OPENSANDBOX_INSECURE_SERVER=YES \
            "$RUNNER_TEMP/opensandbox-server-venv/bin/opensandbox-server" \
            --config "$RUNNER_TEMP/opensandbox.toml" \
            >"$RUNNER_TEMP/opensandbox-server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/opensandbox-server.pid"

          for attempt in {1..120}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/health >/dev/null; then
              echo 'OPEN_SANDBOX_DOMAIN=127.0.0.1:8080' >>"$GITHUB_ENV"
              echo 'OPEN_SANDBOX_API_KEY=' >>"$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/opensandbox-server.log"
          exit 1

      - name: Run end-to-end tests
        run: go test -tags=integration -timeout=25m ./pkg/workspace/opensandbox

      - name: Show ephemeral server logs
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/opensandbox-server.log" ]]; then
            cat "$RUNNER_TEMP/opensandbox-server.log"
          fi

      - name: Clean up ephemeral OpenSandbox
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/opensandbox-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/opensandbox-server.pid")" || true
          fi
          docker ps -aq --filter 'label=opensandbox' | xargs -r docker rm -f
