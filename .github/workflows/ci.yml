name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'Makefile'
      - 'tools/github-setup-deps/**'
      - 'tools/agentsandbox/**'
      - 'tools/opensandbox/**'
      - 'tools/make/**'
      - 'pkg/workspace/internal/sandboxed/assets/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - '**.mod'
      - '**.sum'
      - 'Makefile'
      - 'tools/github-setup-deps/**'
      - 'tools/agentsandbox/**'
      - 'tools/opensandbox/**'
      - 'tools/make/**'
      - 'pkg/workspace/internal/sandboxed/assets/**'
      - '.github/workflows/**'

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    if: github.repository == 'yuluo-yx/agentscope-go'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./tools/github-setup-deps
      - run: make download
      - run: make ci
      - run: make e2e E2E_PROFILE=docker
      - run: tools/opensandbox/install-server.sh
      - run: make e2e E2E_PROFILE=opensandbox
      - run: tools/agentsandbox/install-kind.sh
      - run: make e2e E2E_PROFILE=agent-sandbox
